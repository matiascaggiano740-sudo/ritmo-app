name: Initialize phase zero
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand reviewed scaffold
        run: python3 bootstrap_ritmo.py
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install and validate
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit validated files
        run: |
          rm -f .github/workflows/ci.yml .github/workflows/deploy-web.yml
          rm bootstrap_ritmo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'feat: add phase zero workspace and responsive layout'
          git push
